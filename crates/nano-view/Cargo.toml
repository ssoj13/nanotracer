[package]
name        = "nano-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive PLY splat viewer (winit + wgpu surface, reuses the nano-optimize rasteriser)."

[dependencies]
nano-core     = { workspace = true }
nano-optimize = { workspace = true }
nano-splat    = { workspace = true }
glam          = { workspace = true }
bytemuck      = { workspace = true }
wgpu          = { workspace = true }
winit         = "0.30"
pollster      = { workspace = true }

# egui ecosystem. egui-wgpu pins its own wgpu version internally — if
# the resolver can pick our `wgpu = 29` here we get a single matching
# binding; otherwise cargo will pull both. The user-facing `nano-view`
# only re-exports types through the shared device, so a duplicate
# wgpu crate would refuse to link.
egui = "0.35"
egui-wgpu = { version = "0.35", default-features = false, features = ["winit"] }
egui-winit = { version = "0.35", default-features = false }
egui_dock = { version = "0.20", features = ["serde"] }
egui_plot = "0.36"
serde      = { version = "1", features = ["derive"] }
ron        = "0.8"
